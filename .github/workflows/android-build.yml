name: Android debug build
on:
  push:
    branches: [feature/android-mvp-0-1, feature/v0-2-data-safety]
  pull_request:
    branches: [main, feature/android-mvp-0-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified Gradle distribution
        shell: bash
        run: |
          curl --fail --location --retry 3 --output gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Compile APK and Android instrumentation test sources
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run Android storage regression tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ai-project-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
