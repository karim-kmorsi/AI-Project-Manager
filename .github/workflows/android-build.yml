name: Android debug build
on:
  push:
    branches: [main, diagnose/v0.3.0-startup, release/v0.3.0-integration, feature/android-mvp-0-1, feature/v0-2-data-safety, feature/v0-2-editor-ux, feature/github-snapshot-preview, feature/github-checklist, fix/ci-instrumentation-43829368707]
  pull_request:
    branches: [main, feature/android-mvp-0-1, feature/v0-2-data-safety, feature/github-snapshot-preview]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_githubAppClientId: ${{ vars.APP_CLIENT_ID }}
      ORG_GRADLE_PROJECT_requireGitHubAppClientId: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified Gradle distribution
        shell: bash
        run: |
          curl --fail --location --retry 3 --output gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Compile APK and Android instrumentation test sources
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleVnext :app:assembleVnextAndroidTest
      - uses: actions/upload-artifact@v4
        continue-on-error: true # Storage quota must not block emulator acceptance.
        with:
          name: ai-project-manager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true # Storage quota must not block emulator acceptance.
        with:
          name: ai-project-manager-vnext-apk
          path: app/build/outputs/apk/vnext/*.apk
      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'KVM unavailable'; fi
      - name: Run Android instrumentation tests on isolated VNext package
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle --no-daemon :app:connectedVnextAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.karim.aiprojectmanager.AccessibilityLayoutUiTest,com.karim.aiprojectmanager.RestoreTransactionTest
      - name: Upload Android instrumentation reports
        if: always()
        continue-on-error: true # Preserve test result even when artifact storage is full.
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore
